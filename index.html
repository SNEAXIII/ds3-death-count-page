<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Souls III — Death journal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<div id="root"></div>

<!--
  Pas de bundler : Babel Standalone transpile le JSX dans le navigateur.
  Les fichiers partagent la portée globale, l'ordre de chargement ci-dessous
  est donc l'ordre des dépendances (socle → primitives → sections → app).
  Les scripts étant chargés par requête, la page doit être servie en HTTP
  (voir README.md), pas ouverte en file://.
-->

<!-- socle : preset Babel, helpers, données, i18n, hooks -->
<script src="src/babel-preset.js"></script>
<script src="src/utils.js"></script>
<script src="src/constants.js"></script>
<script src="src/react-globals.js"></script>
<script src="src/i18n.js"></script>
<script src="src/journal-entries.js"></script>
<script src="src/profiles.js"></script>
<script src="src/hooks/useLanguage.js"></script>
<script src="src/hooks/useProfiles.js"></script>
<script src="src/hooks/useFlash.js"></script>
<script src="src/hooks/useJournal.js"></script>

<!-- primitives d'interface réutilisables -->
<script type="text/babel" data-presets="react-classic" src="src/components/SectionLabel.jsx"></script>
<script type="text/babel" data-presets="react-classic" src="src/components/ThemedSelect.jsx"></script>
<script type="text/babel" data-presets="react-classic" src="src/components/AutocompleteInput.jsx"></script>
<script type="text/babel" data-presets="react-classic" src="src/components/LanguageToggle.jsx"></script>

<!-- sections de la page -->
<script type="text/babel" data-presets="react-classic" src="src/components/ProfileBar.jsx"></script>
<script type="text/babel" data-presets="react-classic" src="src/components/DeathCounter.jsx"></script>
<script type="text/babel" data-presets="react-classic" src="src/components/BossTracker.jsx"></script>
<script type="text/babel" data-presets="react-classic" src="src/components/DeathForm.jsx"></script>
<script type="text/babel" data-presets="react-classic" src="src/components/CauseBreakdown.jsx"></script>
<script type="text/babel" data-presets="react-classic" src="src/components/NotesPanel.jsx"></script>
<script type="text/babel" data-presets="react-classic" src="src/components/DeathHistory.jsx"></script>
<script type="text/babel" data-presets="react-classic" src="src/components/JournalActions.jsx"></script>
<script type="text/babel" data-presets="react-classic" src="src/components/FlashOverlay.jsx"></script>

<!-- application et montage -->
<script type="text/babel" data-presets="react-classic" src="src/App.jsx"></script>
<script type="text/babel" data-presets="react-classic" src="src/main.jsx"></script>

</body>
</html>
